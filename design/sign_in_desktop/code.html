pan></div><div class="w-full bg-surface-container-lowest rounded-xl p-space-xl shadow-[0_1px_3px_0_rgba(15,23,42,0.05),0_1px_2px_-1px_rgba(15,23,42,0.05)]"><div class="flex flex-col w-full">
<div class="flex flex-col items-center text-center mb-space-lg">
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight font-semibold">Welcome back</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-space-xs">
      Enter your email and password to sign in to your account.
    </p>
</div>
<form class="flex flex-col gap-space-md w-full" id="signInForm" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-space-xs text-left">
<label class="font-label-md text-label-md text-on-surface font-medium" for="emailInput">
        Email
      </label>
<div class="relative w-full">
<input autocomplete="email" class="w-full h-10 px-space-md rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline shadow-sm focus:outline-none focus:bg-surface-container-low transition-colors duration-150" id="emailInput" name="email" placeholder="name@company.com" required="" type="email" value="alex.morgan@company.com"/>
</div>
</div>
<div class="flex flex-col gap-space-xs text-left">
<label class="font-label-md text-label-md text-on-surface font-medium" for="passwordInput">
        Password
      </label>
<div class="relative w-full flex items-center">
<input autocomplete="current-password" class="w-full h-10 pl-space-md pr-11 rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline shadow-sm focus:outline-none focus:bg-surface-container-low transition-colors duration-150" id="passwordInput" name="password" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-0 top-0 bottom-0 px-3 flex items-center justify-center text-outline hover:text-on-surface transition-colors duration-150 focus:outline-none" id="passwordToggleBtn" type="button">
<span class="material-symbols-outlined text-[18px] select-none" id="passwordEyeIcon">visibility</span>
</button>
</div>
</div>
<div class="pt-space-sm flex flex-col gap-space-lg w-full">
<button class="w-full h-10 rounded-lg bg-primary hover:bg-tertiary text-on-primary font-label-md text-label-md font-medium shadow-sm transition-colors duration-150 flex items-center justify-center gap-space-sm cursor-pointer" id="submitBtn" type="submit">
<span>Sign in</span>
<span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</button>
<div class="text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
          Don't have an account?
          <a class="font-label-md text-label-md text-primary font-medium hover:underline inline-block ml-0.5 transition-all" href="#signup">
            Sign up
          </a>
</p>
</div>
</div>
</form>
</div>
<script>
  (function () {
    const passwordInput = document.getElementById('passwordInput');
    const toggleBtn = document.getElementById('passwordToggleBtn');
    const eyeIcon = document.getElementById('passwordEyeIcon');
    const form = document.getElementById('signInForm');
    const submitBtn = document.getElementById('submitBtn');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', function () {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        if (isPassword) {
          passwordInput.setAttribute('type', 'text');
          eyeIcon.textContent = 'visibility_off';
          toggleBtn.setAttribute('aria-label', 'Hide password');
        } else {
          passwordInput.setAttribute('type', 'password');
          eyeIcon.textContent = 'visibility';
          toggleBtn.setAttribute('aria-label', 'Show password');
        }
      });
    }

    if (form && submitBtn) {
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const originalHtml = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = `
          <svg class="animate-spin h-4 w-4 text-on-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
          </svg>
          <span>Signing in...</span>
        `;
        setTimeout(function () {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalHtml;
        }, 1200);
      });
    }
  })();
</script></div></div></main></body></html>
