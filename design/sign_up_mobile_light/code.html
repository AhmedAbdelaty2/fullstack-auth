<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100%;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-surface": "#0b1c30", "tertiary": "#0051b1", "on-primary": "#ffffff", "primary-fixed": "#dbe1ff", "on-secondary-fixed-variant": "#3f465c", "on-secondary-fixed": "#131b2e", "primary-container": "#2563eb", "on-background": "#0b1c30", "inverse-primary": "#b4c5ff", "on-primary-fixed": "#00174b", "on-secondary": "#ffffff", "outline": "#737686", "primary": "#004ac6", "tertiary-container": "#0f69dc", "error-container": "#ffdad6", "on-tertiary-container": "#edf0ff", "outline-variant": "#c3c6d7", "on-secondary-container": "#5c647a", "surface-container-low": "#eff4ff", "inverse-surface": "#213145", "surface-dim": "#cbdbf5", "tertiary-fixed-dim": "#adc6ff", "on-tertiary": "#ffffff", "surface-container-high": "#dce9ff", "surface": "#f8f9ff", "surface-bright": "#f8f9ff", "on-surface-variant": "#434655", "on-primary-fixed-variant": "#003ea8", "surface-variant": "#d3e4fe", "error": "#ba1a1a", "secondary-fixed": "#dae2fd", "surface-container-highest": "#d3e4fe", "on-primary-container": "#eeefff", "secondary": "#565e74", "on-error": "#ffffff", "primary-fixed-dim": "#b4c5ff", "inverse-on-surface": "#eaf1ff", "on-tertiary-fixed": "#001a42", "on-tertiary-fixed-variant": "#004395", "secondary-container": "#dae2fd", "surface-container": "#e5eeff", "surface-container-lowest": "#ffffff", "tertiary-fixed": "#d8e2ff", "surface-tint": "#0053db", "secondary-fixed-dim": "#     body {
      min-height: max(884px, 100dvh);

  </head><body class="bg-surface text-on-surface font-body-md text-body-md min-h-screen flex flex-col justify-center items-center p-margin pt-safe pb-safe selection:bg-primary-container selection:text-on-primary-container"><main class="flex flex-col relative w-full max-w-[400px] mx-auto bg-surface-container-lowest rounded-full p-space-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="flex flex-col w-full">
<!-- Brand Icon Badge -->
<div class="flex items-center justify-between mb-space-lg">
<div class="flex items-center gap-space-sm">
<div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-primary text-[20px]" style="font-variation-settings: 'FILL' 1;">terminal</span>
</div>
<span class="font-headline-sm text-headline-sm text-on-surface tracking-tight">Kernel</span>
</div>
<span class="px-2 py-0.5 rounded-full bg-surface-container text-tertiary font-code-sm text-code-sm">v2.4</span>
</div>
<!-- Header Section -->
<div class="flex flex-col gap-space-xs mb-space-lg">
<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface tracking-tight">Create your account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Get started with your account today.</p>
</div>
<!-- Form Fields -->
<form class="flex flex-col gap-space-md" id="signup-form" onsubmit="event.preventDefault();">
<!-- Full Name Input -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-sm text-label-sm text-on-surface" for="full-name">Full name</label>
<div class="relative flex items-center">
<input autocomplete="name" class="w-full h-10 px-3 rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md shadow-sm outline-none transition-all placeholder:text-outline focus:bg-surface-container-lowest focus:shadow-md" id="full-name" name="name" type="text" value="Alex Morgan"/>
</div>
</div>
<!-- Email Input -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-sm text-label-sm text-on-surface" for="email">Email</label>
<div class="relative flex items-center">
<input autocomplete="email" class="w-full h-10 px-3 rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md shadow-sm outline-none transition-all placeholder:text-outline focus:bg-surface-container-lowest focus:shadow-md" id="email" name="email" type="email" value="alex.morgan@company.com"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-sm text-label-sm text-on-surface" for="password">Password</label>
<div class="relative flex items-center">
<input autocomplete="new-password" class="w-full h-10 pl-3 pr-10 rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md shadow-sm outline-none transition-all placeholder:text-outline focus:bg-surface-container-lowest focus:shadow-md" id="password" name="password" placeholder="Enter a secure password" type="password" value="Passw0rd!"/>
<button aria-label="Toggle password visibility" class="absolute right-0 top-0 h-10 w-10 flex items-center justify-center text-outline hover:text-on-surface transition-colors cursor-pointer" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[18px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Password Checklist -->
<div class="flex flex-col gap-1.5 p-3 rounded-lg bg-surface-container-low">
<!-- Rule 1: 8+ chars -->
<div class="flex items-center gap-2" id="rule-length">
<span class="rule-icon w-4 h-4 rounded-full bg-primary flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-on-primary text-[11px]" style="font-variation-settings: 'FILL' 1;">check</span>
</span>
<span class="rule-text font-body-sm text-body-sm text-on-surface">At least 8 characters</span>
</div>
<!-- Rule 2: Letter -->
<div class="flex items-center gap-2" id="rule-letter">
<span class="rule-icon w-4 h-4 rounded-full bg-primary flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-on-primary text-[11px]" style="font-variation-settings: 'FILL' 1;">check</span>
</span>
<span class="rule-text font-body-sm text-body-sm text-on-surface">At least one letter</span>
</div>
<!-- Rule 3: Number -->
<div class="flex items-center gap-2" id="rule-number">
<span class="rule-icon w-4 h-4 rounded-full bg-primary flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-on-primary text-[11px]" style="font-variation-settings: 'FILL' 1;">check</span>
</span>
<span class="rule-text font-body-sm text-body-sm text-on-surface">At least one number</span>
</div>
<!-- Rule 4: Special Char -->
<div class="flex items-center gap-2" id="rule-special">
<span class="rule-icon w-4 h-4 rounded-full bg-primary flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-on-primary text-[11px]" style="font-variation-settings: 'FILL' 1;">check</span>
</span>
<span class="rule-text font-body-sm text-body-sm text-on-surface">At least one special character</span>
</div>
</div>
<!-- Action Submit Button -->
<div class="mt-space-sm flex flex-col gap-space-md">
<button class="w-full h-10 rounded-lg bg-primary-container text-on-primary font-label-md text-label-md shadow-sm hover:opacity-95 active:scale-[0.99] transition-all flex items-center justify-center" type="submit">
        Create account
      </button>
<!-- Sign In Option -->
<div class="flex items-center justify-center gap-1.5 py-1">
<span class="font-body-md text-body-md text-on-surface-variant">Already have an account?</span>
<a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#signin">Sign in</a>
</div>
</div>
</form>
</div>
<script>
  (() => {
    const passwordInput = document.getElementById('password');
    const toggleButton = document.getElementById('toggle-password');
    const eyeIcon = document.getElementById('eye-icon');

    const rules = {
      length: { el: document.getElementById('rule-length'), test: (val) => val.length >= 8 },
      letter: { el: document.getElementById('rule-letter'), test: (val) => /[a-zA-Z]/.test(val) },
      number: { el: document.getElementById('rule-number'), test: (val) => /[0-9]/.test(val) },
      special: { el: document.getElementById('rule-special'), test: (val) => /[^A-Za-z0-9]/.test(val) }
    };

    const updateChecklist = () => {
      const val = passwordInput.value;
      for (const key in rules) {
        const item = rules[key];
        const passed = item.test(val);
        const iconContainer = item.el.querySelector('.rule-icon');
        const iconSpan = iconContainer.querySelector('span');
        const textSpan = item.el.querySelector('.rule-text');

        if (passed) {
          iconContainer.className = 'rule-icon w-4 h-4 rounded-full bg-primary flex items-center justify-center transition-colors';
          iconSpan.textContent = 'check';
          iconSpan.className = 'material-symbols-outlined text-on-primary text-[11px]';
          textSpan.className = 'rule-text font-body-sm text-body-sm text-on-surface transition-colors';
        } else {
          iconContainer.className = 'rule-icon w-4 h-4 rounded-full bg-surface-container-highest flex items-center justify-center transition-colors';
          iconSpan.textContent = 'fiber_manual_record';
          iconSpan.className = 'material-symbols-outlined text-outline text-[8px]';
          textSpan.className = 'rule-text font-body-sm text-body-sm text-on-surface-variant transition-colors';
        }
      }
    };

    toggleButton.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });

    passwordInput.addEventListener('input', updateChecklist);
    updateChecklist();
  })();
</script></main></body></html>
