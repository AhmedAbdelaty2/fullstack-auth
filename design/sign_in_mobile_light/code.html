ontainer selection:text-on-primary-container"><main class="flex flex-col relative w-full max-w-[400px] mx-auto bg-surface-container-lowest rounded-full p-space-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="flex flex-col w-full">
<!-- Brand Header -->
<div class="flex items-center gap-space-sm mb-space-lg">
<div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center shadow-sm">
<svg class="w-4 h-4 text-on-primary" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24">
<polygon points="12 2 2 22 22 22 12 2"></polygon>
</svg>
</div>
<span class="font-headline-sm text-headline-sm text-on-surface tracking-tight font-semibold">Apex</span>
</div>
<!-- Title & Context -->
<div class="flex flex-col gap-space-xs mb-space-lg">
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight font-semibold">Welcome back</h1>
<p class="font-body-md text-body-md text-secondary">Enter your credentials to access your account.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-space-md w-full" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col gap-space-xs w-full">
<label class="font-label-md text-label-md text-on-surface font-medium" for="email">Email</label>
<div class="relative w-full">
<input autocomplete="email" class="w-full h-11 px-space-md rounded-lg bg-surface-container-low text-on-surface font-body-md text-body-md placeholder:text-outline outline-none transition-colors duration-150 focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#004ac6]" id="email" name="email" placeholder="name@company.com" required="" type="email" value="alex.morgan@company.com"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-space-xs w-full">
<label class="font-label-md text-label-md text-on-surface font-medium" for="password">Password</label>
<div class="relative w-full flex items-center">
<input autocomplete="current-password" class="w-full h-11 pl-space-md pr-11 rounded-lg bg-surface-container-low text-on-surface font-body-md text-body-md placeholder:text-outline outline-none transition-colors duration-150 focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#004ac6]" id="password" name="password" placeholder="••••••••••••" required="" type="password" value="••••••••••••"/>
<button aria-label="Toggle password visibility" class="absolute right-0 h-11 w-11 flex items-center justify-center text-outline hover:text-on-surface transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Sign In Action -->
<div class="pt-space-sm">
<button class="w-full h-11 rounded-lg bg-primary-container text-on-primary font-label-md text-label-md font-medium shadow-sm transition-all duration-150 hover:bg-tertiary-container active:scale-[0.99] flex items-center justify-center" type="submit">
        Sign in
      </button>
</div>
</form>
<!-- Sign Up Redirection -->
<div class="mt-space-xl text-center">
<p class="font-body-md text-body-md text-secondary">
      Don't have an account? 
      <a class="text-primary font-medium hover:underline transition-all" href="#">Sign up</a>
</p>
</div>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('togglePassword');
    const pwdInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    if (toggleBtn && pwdInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
</script></main></body></html>
